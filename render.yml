services:
  - type: web
    name: basebuildstack
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --legacy-peer-deps --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: basebuildstack
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_URL
        value: https://basebuildstack.onrender.com
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        value: https://basebuildstack.onrender.com
